name: hr-qde-masterand-toolkit

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: hr-qde-masterand-neo4j
    ports:
      - "7474:7474"   # Neo4j browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/masterand-toolkit
      NEO4J_PLUGINS: '["n10s"]'
      # neosemantics requires unrestricted procedure access
      NEO4J_dbms_security_procedures_unrestricted: n10s.*,apoc.*
      NEO4J_dbms_security_procedures_allowlist: n10s.*,apoc.*
      # Heap sizing for ontology + delivery validation workloads
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./neo4j-import:/var/lib/neo4j/import
      - ./neo4j-plugins:/plugins
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  neo4j-data:
  neo4j-logs:
